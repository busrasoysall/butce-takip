<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a1f33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bütçe Takip" />
    <meta name="description" content="Gelirini, giderini ve kartlarını tek yerde yönet." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" href="icon-192.png" />
    <title>Bütçe Takip</title>
    <script>
      try {
        var t = localStorage.getItem('bt_th');
        var d = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        var r = document.documentElement;
        r.dataset.theme = d ? 'dark' : 'light';
        var f = localStorage.getItem('bt_fs');
        r.style.setProperty('--fs', f === '.85' || f === '1' ? f : '.9');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
